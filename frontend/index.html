<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Smart Health Prediction System
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center mb-4">
            Smart Health Prediction System
        </h1>

        <form id="patientForm">

            <input
                type="text"
                id="full_name"
                class="form-control mb-3"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="email"
                class="form-control mb-3"
                placeholder="Email Address"
                required>

            <input
                type="text"
                id="dob"
                class="form-control mb-3"
                placeholder="DD/MM/YYYY"
                required>

            <input
                type="number"
                id="glucose"
                class="form-control mb-3"
                placeholder="Glucose Level"
                required>

            <input
                type="number"
                id="haemoglobin"
                class="form-control mb-3"
                placeholder="Haemoglobin Level"
                required>

            <input
                type="number"
                id="cholesterol"
                class="form-control mb-3"
                placeholder="Cholesterol Level"
                required>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Predict Health

            </button>

        </form>

        <div
            id="result"
            class="mt-4">

        </div>

    </div>

    <div class="card shadow p-4 mt-4">

        <h2 class="mb-3">
            Patient Records
        </h2>

        <div class="table-responsive">

            <table
                class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Date of Birth</th>

                        <th>Email</th>

                        <th>Glucose</th>

                        <th>Haemoglobin</th>

                        <th>Cholesterol</th>

                        <th>Remarks</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="patientTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
